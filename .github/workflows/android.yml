name: Android APK

on:
  push:
    branches: [lan-multiplayer]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch SDL2 Java glue
        run: |
          chmod +x android/fetch-sdl-java.sh
          ./android/fetch-sdl-java.sh 2.30.8 android/app/src/main/java

      # The project bootstraps its own vcpkg checkout (utils/vcpkg_bootstrap.cmake)
      # and appends the sdl2 + system-libs manifest features automatically.
      - name: Build native library (CMake + NDK + vcpkg)
        run: |
          cmake -S . -B build-android -DCMAKE_BUILD_TYPE=Release \
            -DES_USE_VCPKG=ON -DES_GLES=ON \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=OFF
          cmake --build build-android -j --target main

      - name: Package resources and assemble APK
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/assets
          cp build-android/libmain.so android/app/src/main/jniLibs/arm64-v8a/
          # The android triplet links dependencies statically; copy any shared
          # leftovers just in case.
          find vcpkg/installed/arm64-android/lib -maxdepth 1 -name '*.so' \
            -exec cp {} android/app/src/main/jniLibs/arm64-v8a/ \; 2>/dev/null || true
          zip -qr android/app/src/main/assets/resources.zip \
            data images shaders sounds credits.txt keys.txt changelog copyright
          gradle -p android wrapper --gradle-version 8.7 --no-daemon
          ./gradlew -p android assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: endless-sky-esmp-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
